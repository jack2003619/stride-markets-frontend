<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride Markets • Account</title><style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#292044 0,#120e1e 42%,#07060b 100%);color:#fff;font-family:Inter,system-ui,sans-serif}.shell{max-width:720px;min-height:100vh;margin:auto;padding:22px;box-sizing:border-box}.top{height:74px;border:1px solid #32283f;border-radius:28px;background:#100d19;display:flex;align-items:center;padding:0 20px}.brand{display:flex;align-items:center;gap:11px;font-size:22px}.brand img{width:43px;height:43px}.brand span{color:#cda0ff;font-weight:800}.hero{text-align:center;padding:54px 14px} .pill{display:inline-block;border:1px solid #7c6330;color:#f3dc8b;border-radius:999px;padding:12px 22px;letter-spacing:2px;font-weight:800;font-size:12px}h1{font-size:58px;margin:42px 0 16px;letter-spacing:-3px}h1 span{color:#f7bc29}.sub{font-size:19px;line-height:1.55;color:#e8e3ed;margin-bottom:32px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs button{padding:15px;border:1px solid #4b3b5b;background:#1f192d;color:#aaa0b4;border-radius:16px;font-weight:800}.tabs .active{border-color:#8d5cff;background:#5b398f;color:#fff}.form{text-align:left}.field{margin:12px 0}.field label{display:block;color:#bdb4c9;margin-bottom:8px;font-size:14px}.field input{width:100%;height:58px;border:1px solid #40364d;background:#100d18;border-radius:16px;padding:0 18px;color:#fff;font-size:17px;box-sizing:border-box}.primary{width:100%;height:62px;border:0;border-radius:32px;background:linear-gradient(100deg,#27b9ef,#2d63ef);color:#fff;font-size:20px;font-weight:800;margin-top:14px}.switch{text-align:center;color:#a9a1b5;margin-top:15px}.switch button{border:0;background:none;color:#f3cf67;font-weight:800}.error{text-align:center;color:#ff9ba9;min-height:22px;margin-top:8px}.note{margin-top:24px;padding:14px;border:1px solid #342b40;border-radius:17px;color:#9f97aa;font-size:12px}.hidden{display:none!important}@media(max-width:480px){h1{font-size:46px}.hero{padding-top:40px}}</style><style>.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.orb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.35;animation:float 12s ease-in-out infinite}.o1{width:260px;height:260px;background:#7b35ff;left:-70px;top:12%;}.o2{width:220px;height:220px;background:#17cde0;right:-60px;top:35%;animation-delay:-4s}.o3{width:300px;height:300px;background:#f0a81b;left:30%;bottom:-150px;animation-delay:-7s}@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(25px,-35px,0) scale(1.12)}}.gridfx{position:absolute;inset:-50%;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:45px 45px;transform:perspective(450px) rotateX(55deg) translateY(20%);animation:gridmove 18s linear infinite}@keyframes gridmove{to{transform:perspective(450px) rotateX(55deg) translateY(65%)}}</style></head><body><div class="bgfx"><div class="gridfx"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div><div class="shell"><header class="top"><div class="brand"><img src="logo.png"><b>Stride</b><span>MARKETS</span></div></header><section class="hero"><div class="pill">AI POWERED • SECURE • FUTURE READY</div><h1>Stride <span>Markets</span></h1><p class="sub">Secure account access for the Stride Markets simulation platform.</p><div class="tabs"><button id="lt" class="active">Login</button><button id="rt">Create account</button></div><form id="f" class="form"><div id="regFields" class="hidden"><div class="field"><label>First name</label><input id="fn" autocomplete="given-name" required></div><div class="field"><label>Last name</label><input id="ln" autocomplete="family-name" required></div><div class="field"><label>Account name</label><input id="n" autocomplete="nickname" placeholder="Your account name" required></div><div class="field"><label>Phone number</label><input id="ph" type="tel" autocomplete="tel" placeholder="+65 ..." required></div><div class="field"><label>Country</label><input id="co" autocomplete="country-name" placeholder="Singapore" required></div><div class="field"><label>Date of birth</label><input id="dob" type="date" autocomplete="bday" required></div></div><div class="field"><label>Email</label><input id="e" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="p" type="password" minlength="8" autocomplete="new-password" required></div><div id="cfwrap" class="field hidden"><label>Confirm password</label><input id="cp" type="password" minlength="8" autocomplete="new-password"></div><div id="terms" class="field hidden"><label style="display:flex;gap:10px;align-items:center"><input id="termsOk" type="checkbox" style="width:18px;height:18px"> I agree to the Stride Markets simulation terms.</label></div><button id="go" class="primary">Login</button><div id="err" class="error"></div></form><div id="sw" class="switch">New here? <button type="button">Create an account</button></div><div class="note">Simulation environment only • Crypto deposit/withdrawal requests are simulated and require admin review.<br><a href="admin.html" style="color:#c7a3ff">Admin Console</a></div></section></div><script>
const A="https://stride-markets-api-87lf.onrender.com",$=x=>document.getElementById(x);let reg=false;
function setMode(v){reg=v;$("lt").classList.toggle("active",!reg);$("rt").classList.toggle("active",reg);$("regFields").classList.toggle("hidden",!reg);$("cfwrap").classList.toggle("hidden",!reg);$("terms").classList.toggle("hidden",!reg);$("go").textContent=reg?"Create account":"Login";$("sw").innerHTML=reg?'Already registered? <button type="button">Login</button>':'New here? <button type="button">Create an account</button>';$("sw").querySelector("button").onclick=()=>setMode(!reg)}
$("lt").onclick=()=>setMode(false);$("rt").onclick=()=>setMode(true);
$("f").onsubmit=async ev=>{ev.preventDefault();$("err").textContent="";try{if(reg&&$("p").value!==$("cp").value)throw Error("passwords_do_not_match");if(reg&&!$("termsOk").checked)throw Error("terms_required");const body=reg?{displayName:$("n").value,firstName:$("fn").value,lastName:$("ln").value,phone:$("ph").value,country:$("co").value,dateOfBirth:$("dob").value,email:$("e").value,password:$("p").value}:{email:$("e").value,password:$("p").value};const r=await fetch(A+"/api/auth/"+(reg?"register":"login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem("stride_token",d.token);localStorage.setItem("stride_user",JSON.stringify(d.user));location.href="index.html"}catch(e){$("err").textContent=e.message==="invalid_credentials"?"Email or password is incorrect.":e.message==="email_already_registered"?"Email is already registered.":e.message==="display_name_email_and_8_char_password_required"?"Enter an account name, valid email and an 8+ character password.":e.message==="passwords_do_not_match"?"Passwords do not match.":e.message==="terms_required"?"Please accept the terms to continue.":"Server connection failed."}};
</script></body></html>
