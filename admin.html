<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride Admin</title><style>body{margin:0;background:#0b0911;color:#fff;font-family:system-ui;padding:24px}.wrap{max-width:1000px;margin:auto}.card{background:#171329;border:1px solid #342b42;border-radius:20px;padding:20px;margin:14px 0}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:10px;align-items:center}select,input,button{height:44px;border-radius:10px;border:1px solid #463a56;background:#100d18;color:#fff;padding:0 12px}button{background:#7044dd;font-weight:800}.muted{color:#9d98ad}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row button{grid-column:1/-1}}</style></head><body><div class="wrap"><h1>Stride Markets Admin</h1><p class="muted">Simulation-only outcome controls. Never used for live execution.</p><div id="u"></div></div><script>
const A="https://stride-markets-api-87lf.onrender.com",T=localStorage.getItem("stride_token"),$=x=>document.getElementById(x);
async function load(){const m=await fetch(A+"/api/auth/me",{headers:{Authorization:"Bearer "+T}});if(!m.ok)return location.href="auth.html";const me=await m.json();if(me.role!=="admin"){document.body.innerHTML="<h2>Admin access required.</h2>";return}const r=await fetch(A+"/api/admin/users",{headers:{Authorization:"Bearer "+T}}),rows=await r.json();$("u").innerHTML=rows.map(x=>'<div class="card"><div class="row"><div><b>'+x.display_name+'</b><div class="muted">'+(x.email||"")+'</div></div><select id="m'+x.id+'"><option>RANDOM</option><option>PROFIT</option><option>LOSS</option></select><input id="p'+x.id+'" type="number" min="0" max="100" step=".01" value="'+x.simulation_pnl_percent+'"><select id="e'+x.id+'"><option value="true">Enabled</option><option value="false">Disabled</option></select><button onclick="save('+x.id+')">Save</button></div></div>').join("");rows.forEach(x=>{$("m"+x.id).value=x.simulation_mode;$("e"+x.id).value=String(x.simulation_enabled)})}
async function save(id){const r=await fetch(A+"/api/admin/simulation-controls/"+id,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({mode:$("m"+id).value,pnlPercent:Number($("p"+id).value),enabled:$("e"+id).value==="true"})});alert(r.ok?"Saved":"Save failed")}load();
</script></body></html>
