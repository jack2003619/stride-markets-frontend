<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride Markets</title><style>:root{--bg:#07111f;--p:#0d1a2b;--l:#1d3148;--t:#eef6ff;--m:#8ea4bc;--c:#18c7df;--g:#32d583;--r:#ff647c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101c,#0a1625);font-family:Arial;color:var(--t)}header{height:72px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#07111fee}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px}.logo img{width:42px;height:42px}.logo span{color:var(--c)}nav{display:flex;gap:22px}nav a{color:#b7c8da;text-decoration:none;font-size:14px}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1.6fr .9fr;gap:18px}.panel{background:#0c1929cc;border:1px solid var(--l);border-radius:18px;padding:20px}.muted{color:var(--m)}.price{font-size:34px;font-weight:800;margin:12px 0}.up{color:var(--g)}.down{color:var(--r)}.chart{height:330px;display:flex;align-items:end;gap:7px;padding:25px 8px;background:#081321;border-radius:12px}.bar{flex:1;background:linear-gradient(#18c7df,#245b9d);border-radius:5px 5px 2px 2px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #17304a}.balance{font-size:27px;font-weight:800;margin:8px 0 18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}button{border:0;border-radius:11px;padding:13px;font-weight:800}.buy{background:var(--g)}.sell{background:var(--r)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}nav{display:none}}</style></head><body><header><div class="logo"><img src="logo.png"><div>Stride <span>MARKETS</span></div></div><nav><a href="#">Dashboard</a><a href="#">Markets</a><a href="#">Trade</a><a href="#">Orders</a><a href="#">Assets</a></nav></header><main><div class="grid"><section class="panel"><div class="muted">BTC / USDT</div><div class="price">$67,420.18 <small class="up">+2.84%</small></div><div class="chart" id="chart"></div><div class="row"><span class="muted">24h High</span><b>$68,210.44</b></div><div class="row"><span class="muted">24h Low</span><b>$64,918.20</b></div></section><section class="panel"><div class="muted">Paper Trading Balance</div><div class="balance">$10,000.00</div><div class="row"><span class="muted">Available</span><b>$10,000.00</b></div><div class="row"><span class="muted">Unrealized P/L</span><b class="up">+$184.22</b></div><div class="actions"><button class="buy" onclick="alert('Demo Buy order submitted')">BUY</button><button class="sell" onclick="alert('Demo Sell order submitted')">SELL</button></div></section></div><div class="cards"><section class="panel"><div class="muted">BTC/USDT</div><h2>$67,420.18</h2><span class="up">+2.84%</span></section><section class="panel"><div class="muted">ETH/USDT</div><h2>$2,584.61</h2><span class="up">+1.72%</span></section><section class="panel"><div class="muted">SOL/USDT</div><h2>$151.84</h2><span class="down">-0.63%</span></section></div></main><script>for(let i=0;i<42;i++){let b=document.createElement('div');b.className='bar';b.style.height=(30+Math.random()*210)+'px';chart.appendChild(b)}</script></body></html>
